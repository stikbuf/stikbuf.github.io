---
layout: default
---

<article class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  {%- if page.comments and site.giscus.repo and site.giscus.repo_id != "YOUR_REPO_ID" and site.giscus.category_id != "YOUR_CATEGORY_ID" -%}
    {%- include giscus.html -%}
  {%- endif -%}

</article>
