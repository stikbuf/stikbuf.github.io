<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Pages 测试</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: rgba(255,255,255,0.1);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 500px;
    }

    h1 {
      margin-top: 0;
      font-size: 2.5rem;
    }

    p {
      line-height: 1.8;
      font-size: 1.1rem;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: white;
      color: #2a5298;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.05);
      background: #f0f0f0;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>GitHub Pages 测试成功 🚀</h1>

    <p>
      如果你能看到这个页面，说明你的 GitHub Pages 已经部署成功。
    </p>

    <p>
      现在你已经拥有了一个真正的公开网站。
    </p>

    <a class="btn" href="https://github.com" target="_blank">
      打开 GitHub
    </a>
  </div>

</body>
</html>
