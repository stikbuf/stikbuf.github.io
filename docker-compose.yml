services:
  site:
    build: .
    ports:
      - "4000:4000"
      - "35729:35729"
    environment:
      PAGES_REPO_NWO: stikbuf/stikbuf.github.io
    volumes:
      - .:/site
      - bundle:/bundle
    command: bundle _2.5.22_ exec jekyll serve --host 0.0.0.0 --livereload --force_polling

volumes:
  bundle:
